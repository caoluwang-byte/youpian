<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>此地有片</title>
<meta name="description" content="按位置推荐杭州本地文旅短视频，看完一键导航、加入行程。">
<style>
/* Layout: 宽屏左侧作品说明 + 右侧手机尺寸应用；窄屏应用铺满。应用内四个底部标签：附近 / 地图 / 行程 / 设置 */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E4EBE8; --fg:#18231F; --muted:#5B6B65; --line:#D3DCD8;
  --accent:#3E7F70; --accent-soft:#D8EAE4; --seal:#B23A2B; --water:#CFE0E3;
  --c-food:#C9813A; --c-craft:#7A5BA6; --c-sight:#3E7F70; --c-event:#2F6EA8;
  --f-display:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221F; --sunk:#0C1210; --fg:#DCE6E2; --muted:#93A59F; --line:#2B3833;
  --accent:#7DB8A9; --accent-soft:#1F3631; --seal:#E0715F; --water:#1C3036;
  --c-food:#DDA063; --c-craft:#A98BD3; --c-sight:#7DB8A9; --c-event:#6FA3D6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221F; --sunk:#0C1210; --fg:#DCE6E2; --muted:#93A59F; --line:#2B3833;
  --accent:#7DB8A9; --accent-soft:#1F3631; --seal:#E0715F; --water:#1C3036;
  --c-food:#DDA063; --c-craft:#A98BD3; --c-sight:#7DB8A9; --c-event:#6FA3D6; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:500}

/* page shell */
.page{min-height:100%;display:flex;justify-content:center;align-items:center;gap:56px;padding:24px 16px}
.aside{max-width:340px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:40px;height:40px;border:2px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;border-radius:5px;transform:rotate(-4deg);flex:none}
.aside h1{font-size:34px;letter-spacing:.04em}
.aside .lede{color:var(--muted)}
.aside ul{margin:0;padding-left:1.1em;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:6px}
.aside small{color:var(--muted);font-size:12px;line-height:1.6}

.app{width:420px;height:min(860px,calc(100vh - 48px));background:var(--bg);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 24px 60px -32px rgba(20,40,35,.5)}
@media (max-width:900px){
  .page{padding:0;display:block;height:100%}
  .aside{display:none}
  .app{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
}

/* app header */
.head{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;flex-direction:column;gap:8px;background:var(--bg);flex:none}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.origin{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;text-align:left;min-width:0}
.origin .pin{width:10px;height:10px;border-radius:50%;background:var(--seal);box-shadow:0 0 0 4px color-mix(in srgb,var(--seal) 20%,transparent);flex:none}
.origin strong{font-family:var(--f-display);font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.origin span.chev{color:var(--muted);font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:3px 10px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sub{font-size:12px;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.view{flex:1;overflow-y:auto;min-height:0}
.feed{padding:6px 16px 20px;display:flex;flex-direction:column;gap:10px}
.empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:8px;align-items:center}

.card{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.thumb{aspect-ratio:3/4;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;color:#fff;position:relative;overflow:hidden;max-width:100%}
.thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 30% 10%,rgba(255,255,255,.22),transparent 60%)}
.thumb i{position:absolute;right:5px;bottom:4px;font-style:normal;font-family:var(--f-mono);font-size:10px;background:rgba(0,0,0,.45);padding:0 4px;border-radius:3px;z-index:1}
.cbody{min-width:0;display:flex;flex-direction:column;gap:4px;padding-block:2px}
.ctitle{font-weight:600;font-size:15px;line-height:1.4}
.cmeta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cat{font-size:11px;padding:0 6px;border-radius:4px;color:var(--bg);font-weight:600}
.cfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.fav{border:0;background:none;padding:2px 4px;font-size:16px;color:var(--muted);line-height:1}
.fav[aria-pressed="true"]{color:var(--seal)}
.timefit{color:var(--accent)}

/* map */
.mapwrap{padding:6px 16px 16px;display:flex;flex-direction:column;gap:10px}
.mapbox{background:var(--sunk);border-radius:16px;overflow:hidden;aspect-ratio:1/1.05;max-width:100%;position:relative}
.mapbox svg{width:100%;height:100%;display:block;touch-action:manipulation}
.maptools{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.mapsel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.mapsel b{font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13px;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.small{padding:4px 9px;font-size:12px;border-radius:8px}

/* trip */
.trip{padding:6px 16px 20px;display:flex;flex-direction:column;gap:12px}
.tripsum{display:flex;gap:16px;background:var(--fg);color:var(--bg);border-radius:14px;padding:14px 16px}
.tripsum div{display:flex;flex-direction:column}
.tripsum b{font-family:var(--f-mono);font-size:20px;font-weight:500}
.tripsum span{font-size:12px;opacity:.75}
.stop{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stop .n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px}
.stop .t{font-weight:600;font-size:14px;line-height:1.35}
.stop .ops{display:flex;gap:2px}
.stop .ops button{border:0;background:none;color:var(--muted);padding:4px 6px;font-size:14px}
.leg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding-left:13px}
.leg::before{content:"";width:1px;height:22px;background:var(--line);margin-right:14px}
.leg a{color:var(--accent);text-decoration:none}

/* settings */
.settings{padding:6px 16px 24px;display:flex;flex-direction:column;gap:18px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.group h3{font-size:17px}
.ctrl{display:flex;flex-direction:column;gap:4px;font-size:13px}
.ctrl label{display:flex;justify-content:space-between;color:var(--muted)}
.ctrl input[type=range]{accent-color:var(--accent);width:100%}
.formula{background:var(--sunk);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);font-size:12px;line-height:1.7;overflow-x:auto}
.note{font-size:13px;color:var(--muted)}

/* tabbar */
/* 刷片：竖向整屏翻页 */
.swipe{scroll-snap-type:y mandatory;overscroll-behavior:contain;background:#0d1412;scrollbar-width:none}
.swipe::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;color:#fff;background:linear-gradient(170deg,var(--col),color-mix(in srgb,var(--col) 30%,#000) 75%)}
.slide .bgglyph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:min(62vw,260px);line-height:1;color:rgba(255,255,255,.16);user-select:none;pointer-events:none}
.slide .bgglyph b{font-weight:600}
.slide::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 55% at 25% 15%,rgba(255,255,255,.22),transparent 60%),linear-gradient(to top,rgba(0,0,0,.72),transparent 48%);pointer-events:none}
.slide .tapzone{position:absolute;inset:0;border:0;background:none;padding:0;cursor:pointer}
.slide .paused{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.4);display:none;place-items:center;pointer-events:none}
.slide .paused::before{content:"";border-left:20px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.slide.is-paused .paused{display:grid}
.slide .demo{position:absolute;top:calc(52px + env(safe-area-inset-top,0px));right:14px;font-size:11px;background:rgba(0,0,0,.35);padding:1px 8px;border-radius:999px}
.sinfo{position:absolute;left:16px;right:84px;bottom:22px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.sinfo .who{font-weight:600;font-size:15px}
.sinfo h2{font-size:22px;line-height:1.3;color:#fff}
.sinfo p{font-size:13.5px;line-height:1.55;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sinfo .tags{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.sinfo .tags span{background:rgba(255,255,255,.18);padding:1px 8px;border-radius:4px}
.sinfo a.loc{pointer-events:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);color:#fff;text-decoration:none;font-size:13px;padding:5px 10px;border-radius:8px}
.rail{position:absolute;right:10px;bottom:28px;display:flex;flex-direction:column;gap:18px;align-items:center}
.rail button,.rail a{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;text-decoration:none;padding:0;width:58px}
.rail .ic{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.32);display:grid;place-items:center;font-size:21px;line-height:1}
.rail svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.9}
.rail [aria-pressed="true"] .ic{color:#ff5a5f}
.rail [data-strip][aria-pressed="true"] .ic{background:rgba(255,255,255,.28)}
.sprog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.2)}
.sprog span{display:block;height:100%;width:0;background:#fff}
.slide.active .sprog span{animation:prog var(--dur) linear infinite}
.slide.is-paused .sprog span{animation-play-state:paused}
@keyframes prog{from{width:0}to{width:100%}}
@media (prefers-reduced-motion:no-preference){
  .slide.active .bgglyph b{display:inline-block;animation:drift 9s ease-in-out infinite alternate}
  .slide.is-paused .bgglyph b{animation-play-state:paused}
  @keyframes drift{from{transform:scale(1) translateY(0)}to{transform:scale(1.12) translateY(-12px)}}
}
.slide.end{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;--col:#3E7F70}
.slide.end h2{color:#fff;font-size:24px;position:relative}
.slide.end p{opacity:.85;position:relative;font-size:14px}
.slide.end .btn{position:relative}
.swipetop{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px;color:#fff;font-size:13px;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.swipetop button{pointer-events:auto;border:0;background:rgba(0,0,0,.3);color:#fff;border-radius:999px;padding:4px 12px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.tseg{pointer-events:auto;display:flex;background:rgba(0,0,0,.3);border-radius:999px;padding:2px}
.tseg button{border:0;background:none;color:rgba(255,255,255,.75);font-size:12.5px;padding:3px 10px;border-radius:999px;font-weight:500}
.tseg button[aria-pressed="true"]{background:#fff;color:#18231F}
.swipetop .pin{width:8px;height:8px;border-radius:50%;background:#ff6b5a}
.swipehint{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);z-index:3;font-size:12px;color:#fff;background:rgba(0,0,0,.4);padding:4px 12px;border-radius:999px;pointer-events:none}

/* AI */
.aibadge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:0 6px;border-radius:4px;margin-right:6px;background:linear-gradient(120deg,var(--accent),var(--c-event));color:var(--bg);vertical-align:1px}
.slide .aibadge{background:rgba(255,255,255,.9);color:#18231F}
.aitags{display:block;font-size:12.5px;opacity:.85;margin-top:2px}
.aibox{background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.aibox.muted{flex-direction:row;align-items:center;gap:6px}
.aihead{display:flex;justify-content:space-between;align-items:center}
.aisum{font-size:15px;font-weight:600}
.aitagrow{display:flex;gap:6px;flex-wrap:wrap}
.aitagrow span{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--accent)}
.airow{display:flex;gap:10px;font-size:13.5px}
.airow span{color:var(--muted);flex:none}
.airow b{font-weight:500}
.linkbtn2{border:0;background:none;color:var(--accent);font-size:12.5px;padding:0;text-decoration:underline}
.vbadge.off{color:var(--muted);background:var(--sunk)}
details.adv{font-size:13px;color:var(--muted)}
details.adv summary{cursor:pointer;margin-bottom:8px}
details.adv .field{margin-top:8px}
/* 创作者 */
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vbadge{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px;font-weight:600}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
.pitem b{font-weight:600}
.pitem .ops{display:flex;gap:6px;flex:none}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--accent)}
.tventry{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}

/* 电视端（固定深色大屏风格） */
.tv{position:fixed;inset:0;z-index:50;background:#0B1110;color:#E8EFEC;display:grid;place-items:center;padding:16px;overflow:auto;outline:none}
.tvstage{width:min(100%,1280px);display:flex;flex-direction:column;gap:clamp(14px,2.4vw,28px);outline:none}
.tvhead{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.tvbrand{display:flex;align-items:center;gap:10px;font-size:14px;color:#9FB2AB}
.tvbrand .seal{width:30px;height:30px;font-size:15px;border-color:#E0715F;color:#E0715F}
.tvhead h1{font-size:clamp(28px,4vw,52px);letter-spacing:.06em;flex:1;color:#fff}
.tvclose,.tvbtn{border:1px solid #33443F;background:#16201D;color:#E8EFEC;border-radius:999px;padding:8px 18px;font-size:14px}
.tvbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.9fr) minmax(0,.95fr);gap:clamp(14px,2vw,28px);align-items:start}
.tvlist{display:flex;flex-direction:column;gap:10px}
.tvlist button{text-align:left;border:2px solid transparent;background:#151E1B;color:#E8EFEC;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-left:6px solid var(--tc)}
.tvlist button b{font-family:var(--f-display);font-size:clamp(17px,1.7vw,22px)}
.tvlist button span{font-size:13px;color:#9FB2AB}
.tvlist button[aria-current="true"]{border-color:#fff;background:#1E2A26;transform:scale(1.02)}
.tvmain{display:flex;flex-direction:column;gap:16px;min-width:0}
.tvhero{position:relative;overflow:hidden;border-radius:18px;padding:clamp(18px,2.6vw,32px);min-height:clamp(150px,18vw,230px);display:flex;align-items:flex-end;background:linear-gradient(150deg,var(--tc),color-mix(in srgb,var(--tc) 25%,#000))}
.tvglyph{position:absolute;right:4%;top:50%;transform:translateY(-50%);font-family:var(--f-display);font-size:clamp(110px,15vw,200px);color:rgba(255,255,255,.14);line-height:1}
.tvhero h2{font-size:clamp(28px,3.6vw,46px);color:#fff}
.tvhero p{font-size:clamp(14px,1.4vw,18px);opacity:.88}
.tvkicker{font-size:13px;letter-spacing:.08em;opacity:.85}
.tvstops{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tvstops li{display:flex;align-items:center;gap:12px;background:#151E1B;border-radius:12px;padding:12px 14px;min-width:0}
.tvstops li div{display:flex;flex-direction:column;min-width:0;flex:1}
.tvstops b{font-size:16px}
.tvstops span{font-size:12.5px;color:#9FB2AB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvstops em{font-style:normal;font-size:12px;color:#9FB2AB;flex:none}
.tvn{width:30px;height:30px;border-radius:50%;background:#E8EFEC;color:#0B1110;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;flex:none}
.tvqr{background:#151E1B;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.qrbox{background:#fff;border-radius:12px;padding:10px;width:100%;max-width:220px;aspect-ratio:1/1;display:grid;place-items:center}
.qrbox svg{width:100%;height:100%;display:block}
.qrnone{color:#5B6B65;font-size:13px;line-height:1.6}
.tvqr b{font-size:17px}
.tvqr span{font-size:13px;color:#9FB2AB}
.tvfoot{font-size:13px;color:#6F837C;text-align:center}
@media (max-width:900px){.tvbody{grid-template-columns:1fr}.tvlist{flex-direction:row;overflow-x:auto}.tvlist button{flex:none;width:200px}.tvstops{grid-template-columns:1fr}}

/* 账号与资料 */
.avatar{border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:600;max-width:100%}
.profile{gap:14px}
.prow{display:flex;align-items:center;gap:14px}
.prow h3{font-size:20px}
.bio{font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:10px 0;text-align:center}
.stats div{display:flex;flex-direction:column}
.stats div+div{border-left:1px solid var(--line)}
.stats b{font-size:19px;font-weight:500}
.stats span{font-size:12px;color:var(--muted)}
.pmeta{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.pmeta div{display:flex;justify-content:space-between;gap:12px}
.pmeta span{color:var(--muted)}
.pmeta b{font-weight:500;text-align:right}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-top:4px}
.tabs2 button{border:0;background:none;padding:8px 0 10px;font-size:16px;color:var(--muted);font-family:var(--f-display);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button[aria-pressed="true"]{color:var(--fg);border-color:var(--accent);font-weight:600}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px}
.field label,.field .lbl{color:var(--muted);display:flex;justify-content:space-between}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;width:100%;resize:none}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.chips.wrap{flex-wrap:wrap}
.err{color:var(--seal);font-size:13px}
.btn.big{padding:12px;font-size:15px}
.note.small{font-size:12px;text-align:center}
.avatarpick{display:flex;align-items:center;gap:16px}
.danger{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.linkbtn{border:0;background:none;color:var(--seal);font-size:13px;padding:0;align-self:flex-start}
.dangerbtn{background:var(--seal);border-color:var(--seal);color:#fff}
.locs{display:flex;gap:6px;flex-wrap:wrap}
.sinfo a.loc.book{background:rgba(255,255,255,.92);color:#18231F;font-weight:600}
.social{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.social .btn{padding:9px 4px}
.rail{gap:14px}
.media{position:absolute;inset:0;display:grid;place-items:center;background:#000;z-index:0}
.slide::before{z-index:1}
.slide .tapzone{z-index:1}
.sinfo,.rail,.sprog,.slide .paused{z-index:2}
.media video{width:100%;height:100%;object-fit:cover;display:block}
.media.bili{background:#000}
.media.bili iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.slide.has-video .bgglyph{display:none}
.slide.has-video .sprog span{animation:none}
.slide.is-bili::before{background:linear-gradient(to top,rgba(0,0,0,.8),transparent 35%)}
.slide.is-bili .sinfo{bottom:18px}
.slide .demo{display:flex;gap:6px;align-items:center;z-index:2}
.credit{color:#fff;text-decoration:none;font-size:11px}
.sub .credit{color:var(--accent);font-size:12px}
.mute{border:0;background:rgba(0,0,0,.35);color:#fff;font-size:11px;border-radius:999px;padding:1px 8px}
.cover.has-media{background:#000}
.cover.has-media .media{position:static;height:100%}
.cover.has-media video{object-fit:contain}
.cover.has-media iframe{height:100%;aspect-ratio:auto}

.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);flex:none}
.tabbar button{border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--seal);color:#fff;font-size:10px;border-radius:999px;min-width:16px;height:16px;line-height:16px;padding:0 4px;font-family:var(--f-mono)}

/* detail sheet */
.scrim{position:absolute;inset:0;background:rgba(10,20,18,.42);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--bg);border-radius:20px 20px 0 0;z-index:6;display:flex;flex-direction:column;overflow:hidden}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.sheetbody{overflow-y:auto;padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.cover{aspect-ratio:16/9;border-radius:14px;display:grid;place-items:center;position:relative;color:#fff;font-family:var(--f-display);font-size:64px;overflow:hidden;max-width:100%}
.cover .play{position:absolute;inset:auto auto 12px 12px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.5);color:#fff;border:0;border-radius:999px;padding:5px 12px 5px 8px;font-family:var(--f-body);font-size:12px}
.cover .play::before{content:"";border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:4px}
.cover .tagdemo{position:absolute;top:10px;right:10px;font-family:var(--f-body);font-size:11px;background:rgba(0,0,0,.45);padding:1px 8px;border-radius:999px}
.sheet h2{font-size:24px;line-height:1.3}
.desc{font-size:14.5px;color:var(--fg)}
.tip{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:8px 12px}
.actions{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.actions .btn{padding:10px 6px}
.nexts{display:flex;flex-direction:column;gap:6px}
.nexts button{display:flex;justify-content:space-between;gap:10px;border:0;border-bottom:1px dashed var(--line);background:none;padding:6px 0;text-align:left;font-size:14px}
.nexts .mono{color:var(--muted);font-size:12px;white-space:nowrap}
.close{position:absolute;right:12px;top:10px;border:0;background:var(--surface);border-radius:50%;width:30px;height:30px;color:var(--muted);font-size:18px;line-height:1;z-index:1}

.picker{display:flex;flex-direction:column;gap:6px}
.picker button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left}
.picker button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.picker small{color:var(--muted);font-size:12px}

.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:999px;z-index:9;max-width:88%;text-align:center}

@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .26s cubic-bezier(.2,.8,.2,1)}
  .scrim{animation:fade .2s}
  @keyframes up{from{transform:translateY(40px);opacity:.5}}
  @keyframes fade{from{opacity:0}}
  .card{transition:border-color .15s}
}
</style>
</head>
<body>
<div class="page">
  <main class="app" id="app">
    <header class="head" id="head">
      <div class="headrow">
        <button type="button" class="origin" id="originBtn" aria-label="切换出发点"><span class="pin"></span><strong id="originName">断桥残雪</strong><span class="chev">▾</span></button>
        <div class="seg" id="seg" role="group" aria-label="时段">
          <button type="button" data-t="am">上午</button><button type="button" data-t="pm">下午</button><button type="button" data-t="night">夜晚</button>
        </div>
      </div>
      <div class="sub" id="sub"></div>
      <div id="filters">
        <label class="search" for="q"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="搜地点或内容，如：运河、小笼" autocomplete="off"></label>
        <div class="chips" id="chips" style="margin-top:8px"></div>
      </div>
    </header>

    <div class="swipetop" id="swipetop">
      <button type="button" data-picker="1"><span class="pin"></span><span id="swipeOrigin">断桥残雪</span> ▾</button>
      <div class="tseg" id="tseg" role="group" aria-label="时段"><button type="button" data-st="am">上午</button><button type="button" data-st="pm">下午</button><button type="button" data-st="night">夜晚</button></div>
    </div>
    <div class="view swipe" id="view-swipe"></div>
    <div class="view" id="view-near" hidden></div>
    <div class="view" id="view-map" hidden></div>
    <div class="view" id="view-trip" hidden></div>
    <div class="view" id="view-set" hidden></div>

    <nav class="tabbar" role="tablist" id="tabbar">
      <button type="button" role="tab" data-tab="swipe" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2.5"/><path d="M12 8v8M9.5 10.5 12 8l2.5 2.5"/></svg>短视频</button>
      <button type="button" role="tab" data-tab="near" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>附近</button>
      <button type="button" role="tab" data-tab="map" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>地图</button>
      <button type="button" role="tab" data-tab="trip" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6h6a3 3 0 0 1 0 6h-4a3 3 0 0 0 0 6h6"/></svg>行程<span class="badge" id="tripBadge" hidden>0</span></button>
      <button type="button" role="tab" data-tab="set" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>设置</button>
    </nav>
  </main>
</div>

 {id:1,t:"清晨的灵隐，第一声钟",cat:"sight",g:"钟",lat:30.2408,lng:120.1013,place:"灵隐寺",q:.88,tm:["am"],src:"pro",dur:"1:42",desc:"开门后不久的灵隐寺人最少，山间的雾还没散。片子跟着飞来峰石刻一路走到大雄宝殿。",tip:"景区可能需要提前预约，请以官方渠道为准。"},
 {id:2,t:"龙井村：跟茶农炒一锅茶",cat:"craft",g:"茶",lat:30.2297,lng:120.1282,place:"龙井村",q:.82,tm:["am","pm"],src:"ugc",dur:"2:15",desc:"从采青到手工炒制，看茶农怎么用手掌控制锅温。村里多家茶农提供炒茶体验，适合带孩子。",tip:"春茶季（三四月）最热闹，其他季节以喝茶、看茶园为主。"},
 {id:3,t:"河坊街，刚出锅的定胜糕",cat:"food",g:"糕",lat:30.2445,lng:120.1700,place:"河坊街",q:.74,tm:["pm"],src:"ugc",dur:"0:48",desc:"粉色的定胜糕是杭州老点心，松软微甜。河坊街一带糕团铺集中，可以边走边吃。",tip:"节假日人流大，建议避开下午高峰。"},
 {id:4,t:"南宋御街慢慢走",cat:"sight",g:"街",lat:30.2490,lng:120.1712,place:"南宋御街",q:.69,tm:["pm","night"],src:"pro",dur:"3:05",desc:"从鼓楼一路向北，沿途能看到御街遗址展示、老字号和骑楼。片子讲了这条街八百多年的变化。",tip:"全程步行约一小时，可以和河坊街连着逛。"},
 {id:5,t:"湖滨音乐喷泉，提前去占位",cat:"event",g:"泉",lat:30.2593,lng:120.1622,place:"湖滨音乐喷泉",q:.85,tm:["night"],src:"gov",dur:"1:10",desc:"晚上的湖滨步行街临湖一侧，喷泉随音乐起落。片子标出了几个视野好的观看位置。",tip:"演出场次和时间以景区当日公告为准。"},
 {id:6,t:"断桥：从白堤看过去的西湖",cat:"sight",g:"桥",lat:30.2588,lng:120.1517,place:"断桥残雪",q:.80,tm:["am","pm"],src:"pro",dur:"1:25",desc:"断桥是白堤的起点。沿白堤走向孤山，一边是外西湖，一边是北里湖，适合清晨散步。",tip:"清晨和傍晚人少，光线也最好。"},
 {id:7,t:"苏堤春晓，骑车三公里",cat:"sight",g:"堤",lat:30.2440,lng:120.1430,place:"苏堤",q:.83,tm:["am","pm"],src:"ugc",dur:"2:02",desc:"苏堤南北长约三公里，六座桥一路相连。片子用一镜到底拍完了整条堤。",tip:"堤上共享单车停放有区域限制，留意现场指引。"},
 {id:8,t:"雷峰塔看夕照",cat:"sight",g:"塔",lat:30.2310,lng:120.1490,place:"雷峰塔",q:.86,tm:["pm"],src:"pro",dur:"1:38",desc:"「雷峰夕照」是西湖十景之一。登塔可以俯瞰整个西湖，日落前半小时上去刚好。",tip:"塔内需购票，具体开放时间以景区公告为准。"},
 {id:9,t:"一片茶叶的博物馆",cat:"craft",g:"叶",lat:30.2350,lng:120.1350,place:"中国茶叶博物馆",q:.72,tm:["am","pm"],src:"pro",dur:"2:30",desc:"展馆藏在茶园中间，从茶的起源讲到各地茶俗，展厅外就是可以散步的茶山。",tip:"建议预留一个半小时。"},
 {id:10,t:"拱宸桥下的运河夜色",cat:"sight",g:"宸",lat:30.3195,lng:120.1440,place:"拱宸桥",q:.90,tm:["night"],src:"pro",dur:"2:40",desc:"拱宸桥是京杭大运河杭州段的标志。夜里两岸亮灯，桥下货船和游船往来，是运河最有生活感的时候。",tip:"可以坐运河水上巴士到达，班次以当日运营为准。"},
 {id:11,t:"小河直街，运河边的老街",cat:"sight",g:"河",lat:30.3060,lng:120.1420,place:"小河直街",q:.70,tm:["pm"],src:"ugc",dur:"1:15",desc:"三河交汇处的历史街区，白墙黑瓦，居民还住在里面，比热门景区安静很多。",tip:"住户区域请保持安静。"},
 {id:12,t:"杭扇是怎么做出来的",cat:"craft",g:"扇",lat:30.3175,lng:120.1425,place:"杭州手工艺活态馆",q:.81,tm:["am","pm"],src:"pro",dur:"2:20",desc:"运河边的手工艺活态馆里，可以看匠人现场制扇、做油纸伞和刺绣，部分工坊提供体验课。",tip:"体验课需提前咨询场馆。"},
 {id:13,t:"大兜路的夜宵",cat:"food",g:"夜",lat:30.3050,lng:120.1470,place:"大兜路历史街区",q:.76,tm:["night"],src:"ugc",dur:"1:05",desc:"沿运河的一排老房子里开着餐馆和小酒馆，吃完可以顺着河走到香积寺。",tip:"周末晚间热门店需要等位。"},
 {id:14,t:"胜利河边吃一圈",cat:"food",g:"食",lat:30.2950,lng:120.1520,place:"胜利河美食街",q:.74,tm:["night"],src:"ugc",dur:"0:58",desc:"沿河一整排小吃店，烧烤、葱包桧、糖水都有，人均不高，是本地人常去的夜宵地。",tip:"沿河步道较窄，带小孩注意安全。"},
 {id:15,t:"西溪摇橹船，听船娘讲湿地",cat:"sight",g:"船",lat:30.2700,lng:120.0650,place:"西溪国家湿地公园",q:.84,tm:["am","pm"],src:"pro",dur:"2:05",desc:"坐摇橹船穿过芦苇和柿子林，船娘一路讲湿地里的老村落和鸟类。",tip:"船票在园内购买，秋天柿子成熟时最好看。"},
 {id:16,t:"良渚：五千年前的城",cat:"sight",g:"玉",lat:30.3970,lng:119.9980,place:"良渚古城遗址公园",q:.86,tm:["am","pm"],src:"gov",dur:"3:30",desc:"世界文化遗产。园区很大，可以坐电瓶车看宫殿区、城墙和水坝遗址，配合良渚博物院一起看更完整。",tip:"需提前预约，建议安排半天以上。"},
 {id:17,t:"运河边的周末手作市集",cat:"event",g:"集",lat:30.3185,lng:120.1450,place:"拱宸桥",q:.67,tm:["pm"],src:"gov",dur:"0:58",desc:"拱宸桥周边不定期举办手作和文创市集，可以和运河夜游连在一起安排。",tip:"举办时间以主办方当期发布为准。"},

async function hashPwd(salt,pwd){
  const txt=salt+":"+pwd;
  try{
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ // 不支持 Web Crypto 的环境
    let h1=0xdeadbeef,h2=0x41c6ce57;
    for(let i=0;i<txt.length;i++){const c=txt.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
    return "f"+((h1>>>0).toString(16))+((h2>>>0).toString(16));
  }
}

function km(a,b){
  const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtD=d=>d<1?Math.round(d*1000/10)*10+" m":d<10?d.toFixed(1)+" km":Math.round(d)+" km";
function travel(d){
  if(d<1.5)return "步行约"+Math.max(1,Math.round(d/4.5*60))+"分钟";
  return "驾车约"+Math.max(5,Math.round(d/22*60+4))+"分钟";
}
function amapMarker(it){return `https://uri.amap.com/marker?position=${it.lng},${it.lat}&name=${encodeURIComponent(it.place)}&coordinate=gaode&callnative=1`}
function amapRoute(a,b){
  const mode=km(a,b)<1.5?"walk":"car";
  return `https://uri.amap.com/navigation?from=${a.lng},${a.lat},${encodeURIComponent(a.place||a.n||"起点")}&to=${b.lng},${b.lat},${encodeURIComponent(b.place)}&mode=${mode}&coordinate=gaode&callnative=1`;
}

  4:{am:.2,pm:.7,night:1},  5:{am:0,pm:0,night:1},    6:{am:1,pm:.5,night:.4},

function score(it){
  const d=km(originObj(),it), wt=Math.max(0,1-st.wd-st.wq);
  const f=(FIT[it.id]||{})[st.t]||0, p=me();
  const like=p&&p.interests&&p.interests.includes(it.cat)?.12:0; // 感兴趣的内容类型加分
  return {d,fit:f>=.8,s:st.wd*Math.exp(-d/TAU)+st.wq*it.q+wt*f+like};
}
function list(){
  const q=st.q.trim();
  return ITEMS.filter(i=>(st.cat==="all"||i.cat===st.cat)&&(!st.favOnly||st.favs.has(i.id))&&
      (!q||(i.t+i.place+i.desc+CATS[i.cat].n).includes(q)))
    .map(i=>Object.assign({},i,score(i))).sort((a,b)=>b.s-a.s);
}

        <button type="button" data-open="${i.id}"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>详情</button>
      </div>
      <div class="sprog"><span></span></div>
    </section>`;
  }).join("")+`<section class="slide end"><h2>附近的片都刷完了</h2><p>换个出发点，或者去行程里把想去的地方排一排。</p><button type="button" class="btn primary" data-picker="1">换个出发点</button><button type="button" class="btn" data-tab-go="trip">看我的行程${st.trip.length?`（${st.trip.length}）`:""}</button></section>`;
  if(!st.seenHint){const h=document.createElement("div");h.className="swipehint";h.id="swipehint";h.textContent="上下滑动，刷下一条";$("#app").appendChild(h);}
  if(swipeIO)swipeIO.disconnect();
  const slides=v.querySelectorAll(".slide");
  if("IntersectionObserver" in window){
    swipeIO=new IntersectionObserver(es=>es.forEach(e=>{
      e.target.classList.toggle("active",e.isIntersecting);
      if(e.isIntersecting&&e.target.dataset.id){aiEnsure(+e.target.dataset.id);const nx=e.target.nextElementSibling;if(nx&&nx.dataset.id)aiEnsure(+nx.dataset.id)}
      const vid=e.target.querySelector("video");
      if(vid){if(e.isIntersecting&&!e.target.classList.contains("is-paused")){vid.play().catch(()=>{})}else vid.pause()}
      if(e.isIntersecting&&e.target.dataset.k!=="0"&&!st.seenHint){st.seenHint=true;store.set("hint",true);const h=$("#swipehint");if(h)h.remove()}
    }),{root:v,threshold:.6});
    slides.forEach(s=>swipeIO.observe(s));
    v.querySelectorAll(".slide video").forEach(vid=>{
      const bar=vid.closest(".slide").querySelector(".sprog span");
      vid.addEventListener("timeupdate",()=>{if(vid.duration)bar.style.width=(vid.currentTime/vid.duration*100)+"%"});

    });
  }else if(slides[0])slides[0].classList.add("active");
}

/* ---------- 地图 ---------- */
function renderMap(){
  const o=originObj(), L=ITEMS.map(i=>Object.assign({},i,score(i)));
  const W=400,H=420, span=st.mapScope==="near"?4.5:18; // 半径 km
  const cx=st.mapScope==="near"?o.lat:30.29, cy=st.mapScope==="near"?o.lng:120.12;
  const kx=111.32*Math.cos(cx*Math.PI/180), ky=110.57, s=(W/2)/span;
  const px=g=>W/2+(g.lng-cy)*kx*s, py=g=>H/2-(g.lat-cx)*ky*s;
  const P=(lat,lng)=>[px({lng}),py({lat})].map(v=>v.toFixed(1)).join(",");
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="内容地点分布">`;
  // 西湖示意轮廓
  const lake=[[30.2645,120.1500],[30.2600,120.1600],[30.2520,120.1635],[30.2420,120.1620],[30.2330,120.1560],[30.2310,120.1450],[30.2380,120.1380],[30.2490,120.1365],[30.2590,120.1400]];
  svg+=`<polygon points="${lake.map(p=>P(p[0],p[1])).join(" ")}" fill="${css('--water')}" stroke="none"/>`;
  // 大运河示意

function renderTrip(){
  const stops=st.trip.map(id=>ITEMS.find(i=>i.id===id)).filter(Boolean);
  if(!stops.length){
    $("#view-trip").innerHTML=`<div class="empty"><b style="color:var(--fg)">行程还是空的</b><span>在任意内容里点「加入行程」，这里会按顺序排好路线，并算出每段距离。</span><button type="button" class="btn primary" data-tab-go="near" style="margin-top:6px">去看附近的片</button></div>`;
    return;
  }
  const o=originObj();
  let total=km(o,stops[0]); for(let k=1;k<stops.length;k++)total+=km(stops[k-1],stops[k]);
  let h=`<div class="trip"><div class="tripsum"><div><b>${stops.length}</b><span>站</span></div><div><b>${total.toFixed(1)}</b><span>总距离 km</span></div><div style="margin-left:auto;justify-content:center"><button type="button" class="btn small" data-optimize="1">按顺路重排</button></div></div>`;
  const legHtml=(a,b)=>{const d=km(a,b);return `<div class="leg"><span class="mono">${fmtD(d)}</span><span>${travel(d)}</span><a href="${amapRoute(a,b)}" target="_blank" rel="noopener">导航</a></div>`};
  h+=`<div class="sub">从 <b style="color:var(--fg)">${esc(o.n)}</b> 出发</div>`+legHtml(o,stops[0]);
  stops.forEach((s,k)=>{
    h+=`<div class="stop"><span class="n">${k+1}</span><div style="min-width:0"><div class="t">${esc(s.place)}</div><div class="sub">${esc(s.t)}</div></div>
      <div class="ops"><button type="button" data-mv="${k},-1" aria-label="上移" ${k===0?"disabled":""}>↑</button><button type="button" data-mv="${k},1" aria-label="下移" ${k===stops.length-1?"disabled":""}>↓</button><button type="button" data-rm="${s.id}" aria-label="移除">✕</button></div></div>`;
    if(k<stops.length-1)h+=legHtml(stops[k],stops[k+1]);
  });
  h+=`<button type="button" class="btn" data-clear="1" style="align-self:flex-start;margin-top:4px">清空行程</button>`;
  h+=`<p class="note">距离为直线估算，实际路程以高德导航为准。</p></div>`;
  $("#view-trip").innerHTML=h;
}
function optimizeTrip(){ // 从出发点开始的最近邻顺序
  let cur=originObj(), rest=st.trip.slice(), out=[];
  while(rest.length){
    rest.sort((a,b)=>km(cur,ITEMS.find(i=>i.id===a))-km(cur,ITEMS.find(i=>i.id===b)));
    const n=rest.shift(); out.push(n); cur=ITEMS.find(i=>i.id===n);
  }
  st.trip=out;saveTrip();toast("已按顺路重排");
}

async function submitAuth(form){
  const reg=form.dataset.mode==="register", err=$("#authErr");
  const fail=m=>{err.textContent=m;err.hidden=false};
  const val=id=>{const el=form.querySelector("#"+id);return el?el.value:""};
  const acc=val("acc").trim(), pwd=val("pwd");
  if(!validAccount(acc))return fail("请输入正确的手机号或邮箱");
  const all=users();
  if(reg){
    const nick=val("nick").trim();
    if(all[acc])return fail("这个账号已经注册过了，请直接登录");
    if(!nick)return fail("请填写昵称");
    if(pwd.length<6)return fail("密码至少需要 6 位");
    if(pwd!==val("pwd2"))return fail("两次输入的密码不一致");
    const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
    all[acc]={salt,hash:await hashPwd(salt,pwd),nick,bio:"",avatar:"",home:"",interests:[],created:Date.now()};
    store.set("users",all);
    loginAs(acc,true);toast(`注册成功，欢迎你，${nick}`);
  }else{
    const u=all[acc];
    if(!u)return fail("没有找到这个账号，可以先注册");
    if(await hashPwd(u.salt,pwd)!==u.hash)return fail("密码不正确");
    loginAs(acc,false);toast(`欢迎回来，${u.nick}`);
  }
}

function readAvatar(file){
  return new Promise((ok,no)=>{
    const r=new FileReader();
    r.onerror=no;
    r.onload=()=>{const img=new Image();img.onerror=no;img.onload=()=>{
      const S=160,c=document.createElement("canvas");c.width=c.height=S;
      const k=Math.max(S/img.width,S/img.height),w=img.width*k,h=img.height*k;
      c.getContext("2d").drawImage(img,(S-w)/2,(S-h)/2,w,h);ok(c.toDataURL("image/jpeg",.85));
    };img.src=r.result};
    r.readAsDataURL(file);
  });
}

}

/* ---------- AI 内容分析（由后台接口调用大模型） ----------
   AI_ENDPOINT 填你部署好的后台接口地址（见 ai-proxy-worker.js）。
   API Key 只放在后台，网页里不出现。留空则不启用，显示原来的简介。 */
const AI_ENDPOINT="";
const aiReady=()=>!!AI_ENDPOINT;
const aiMem={}, aiBusy={};
function aiSig(it){return [it.t,it.place,it.cat,it.desc].join("|")}
function aiGet(it){
  if(aiMem[it.id])return aiMem[it.id];
  const all=store.get("aicache",{}),r=all[it.id];
  if(r&&r.sig===aiSig(it)){aiMem[it.id]=r;return r}
  return null;
}
function aiPut(it,r){r.sig=aiSig(it);aiMem[it.id]=r;const all=store.get("aicache",{});all[it.id]=r;store.set("aicache",all)}
function cleanAI(j){
  const clip=(s,n)=>String(s||"").trim().slice(0,n);
  const tags=(Array.isArray(j.tags)?j.tags:[]).map(t=>clip(t,8).replace(/^#/,"")).filter(Boolean).slice(0,3);
  if(!j.summary)throw new Error("empty");
  return {summary:clip(j.summary,40),tags,crowd:clip(j.crowd,24),tip:clip(j.tip,40),at:Date.now()};
}
async function aiAnalyze(it,force){
  if(!force){const c=aiGet(it);if(c)return c}
  if(aiBusy[it.id])return aiBusy[it.id];
  aiBusy[it.id]=(async()=>{
    const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),25000);
    try{
      const f=FIT[it.id]||{};
      const res=await fetch(AI_ENDPOINT,{method:"POST",signal:ctl.signal,headers:{"Content-Type":"application/json"},
        body:JSON.stringify({title:it.t,place:it.place,cat:CATS[it.cat].n,times:Object.keys(TN).filter(k=>(f[k]||0)>=.8).map(k=>TN[k]),desc:it.desc,tip:it.tip||""})});
      if(!res.ok)throw new Error("status "+res.status);
      const r=cleanAI(await res.json());aiPut(it,r);return r;
    }finally{clearTimeout(timer);delete aiBusy[it.id]}
  })();
  return aiBusy[it.id];
}
function aiInline(i){
  const r=aiReady()?aiGet(i):null;
  if(!r)return esc(i.desc);
  return `<span class="aibadge">AI 看点</span>${esc(r.summary)}${r.tags.length?`<span class="aitags">${r.tags.map(t=>"#"+esc(t)).join(" ")}</span>`:""}`;
}
function aiPaint(id){
  const it=ITEMS.find(x=>x.id===id); if(!it)return;
  document.querySelectorAll(`.sdesc[data-ai="${id}"]`).forEach(el=>el.innerHTML=aiInline(it));
  if(st.detail===id){const d=$("#aiDetail");if(d)d.innerHTML=aiDetailHTML(it)}
}
const aiFailed=new Set();
function aiEnsure(id){
  if(!aiReady()||aiFailed.has(id))return;
  const it=ITEMS.find(x=>x.id===id); if(!it||aiGet(it))return;
  aiAnalyze(it).then(()=>aiPaint(id)).catch(()=>{aiFailed.add(id);if(st.detail===id){const d=$("#aiDetail");if(d)d.innerHTML=""}});
}
function aiDetailHTML(it){
  if(!aiReady()||aiFailed.has(it.id))return "";
  const r=aiGet(it);
  if(!r){aiEnsure(it.id);return `<div class="aibox"><span class="aibadge">AI 解读</span><span class="note">正在分析这条内容…</span></div>`}
  return `<div class="aibox"><div class="aihead"><span class="aibadge">AI 解读</span><button type="button" class="linkbtn2" data-airedo="${it.id}">重新生成</button></div>
    <p class="aisum">${esc(r.summary)}</p>
    ${r.tags.length?`<div class="aitagrow">${r.tags.map(t=>`<span>#${esc(t)}</span>`).join("")}</div>`:""}
    ${r.crowd?`<div class="airow"><span>适合</span><b>${esc(r.crowd)}</b></div>`:""}
    ${r.tip?`<div class="airow"><span>建议</span><b>${esc(r.tip)}</b></div>`:""}
    <span class="note small" style="text-align:left">AI 根据视频信息自动生成，仅供参考</span></div>`;
}

function useGPS(){
  const msg=$("#gpsMsg");
  if(!("geolocation" in navigator)){msg.textContent="当前浏览器不支持定位，请选择下方地点";return}
  msg.textContent="正在获取位置…";
  try{
    navigator.geolocation.getCurrentPosition(p=>{
      const g={id:"gps",n:"我的位置",lat:p.coords.latitude,lng:p.coords.longitude,place:"我的位置"};
      const far=km(g,ORIGINS[0])>60;
      if(far){msg.textContent="你目前不在杭州，已切换到断桥残雪作为出发点";st.origin={id:"duanqiao"};}
      else st.origin=g;
      store.set("origin",st.origin.id==="gps"?{id:"duanqiao"}:st.origin);
      setTimeout(()=>{closeSheet();renderAll()},far?1400:0);
    },()=>{msg.textContent="没有获取到定位权限，请选择下方地点"},{enableHighAccuracy:false,timeout:8000,maximumAge:300000});
  }catch(e){msg.textContent="定位不可用，请选择下方地点"}
}

  if(d.scope){st.mapScope=d.scope;renderMap();return}
  if(d.mv){const [k,dir]=d.mv.split(",").map(Number);const a=st.trip;[a[k],a[k+dir]]=[a[k+dir],a[k]];saveTrip();renderTrip();return}
  if(d.rm){st.trip=st.trip.filter(x=>x!==+d.rm);saveTrip();renderTrip();return}
  if(d.clear){st.trip=[];saveTrip();renderTrip();toast("行程已清空");return}
  if(d.optimize){optimizeTrip();renderTrip();return}
  if(d.reset){st.wd=.35;st.wq=.2;store.set("wd2",st.wd);store.set("wq2",st.wq);renderSet();toast("已恢复默认");return}
  if(d.wipe){st.favs.clear();st.trip=[];saveFavs();saveTrip();renderAll();toast("已清除")}
});
$("#app").addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeSheet();return}
  if(st.tab==="swipe"&&!st.detail&&(e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="PageDown"||e.key==="PageUp")){
    const v=$("#view-swipe");e.preventDefault();
    v.scrollBy({top:(e.key==="ArrowDown"||e.key==="PageDown"?1:-1)*v.clientHeight,behavior:"smooth"});return;
  }
  if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("card")){e.preventDefault();openDetail(+e.target.dataset.open)}
});
$("#app").addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="authForm")submitAuth(e.target);
  if(e.target.id==="profileForm")submitProfile(e.target);
  if(e.target.id==="applyForm")submitApply(e.target);
  if(e.target.id==="postForm")submitPost(e.target);
});
$("#app").addEventListener("change",async e=>{
  if(e.target.id!=="avFile"||!e.target.files[0])return;
  try{
    const url=await readAvatar(e.target.files[0]);
    $("#sheet")._avatar=url;$("#avPreview").innerHTML=`<img class="avatar" src="${url}" alt="" style="width:72px;height:72px">`;
  }catch(err){toast("这张图片读不出来，换一张试试")}
});
$("#app").addEventListener("input",e=>{
  if(e.target.id==="pbio"){$("#bioCount").textContent=e.target.value.length+"/60";return}
  if(e.target.id==="ptitle"){$("#ptc").textContent=e.target.value.length+"/24";return}
  if(e.target.id==="q"){st.q=e.target.value;renderNear();return}
  if(e.target.id==="wd"||e.target.id==="wq"){
    st[e.target.id]=+e.target.value;store.set(e.target.id+"2",st[e.target.id]);
    $("#"+e.target.id+"v").textContent=st[e.target.id].toFixed(2);
    $("#wtv").textContent=Math.max(0,1-st.wd-st.wq).toFixed(2);
  }
});
try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(st.tab==="map")renderMap()})}catch(e){}
try{new MutationObserver(()=>{if(st.tab==="map")renderMap()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}

const h=(location.hash||"").slice(1); if(["swipe","near","map","trip","set"].includes(h))st.tab=h;
document.addEventListener("click",e=>{
  if(!e.target.closest("#tv"))return;
  const t=e.target.closest("[data-tvsel],[data-tvimport],[data-tvclose]");if(!t)return;
  if(t.dataset.tvsel){tvSel=+t.dataset.tvsel;renderTV();return}
  if(t.dataset.tvimport){closeTV();importTrip(TOPICS[tvSel].ids,TOPICS[tvSel].n);return}
  if(t.dataset.tvclose)closeTV();
});
document.addEventListener("keydown",e=>{
  if(!$("#tv"))return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();tvSel=(tvSel+(e.key==="ArrowDown"?1:TOPICS.length-1))%TOPICS.length;renderTV();}
  else if(e.key==="Enter"){e.preventDefault();closeTV();importTrip(TOPICS[tvSel].ids,TOPICS[tvSel].n)}
  else if(e.key==="Escape"||e.key==="Backspace"){e.preventDefault();closeTV()}
});

renderAll();
// 扫电视端二维码打开时：?trip=6,7,8&topic=0
try{
  const qs=new URLSearchParams(location.search), tr=qs.get("trip");
  if(tr){
    const k=+qs.get("topic"), name=TOPICS[k]?TOPICS[k].n:"电视端行程";
    importTrip(tr.split(",").map(Number).filter(Boolean),name);
    history.replaceState(null,"",location.pathname+"#trip");
  }else if(location.hash==="#tv")openTV();
}catch(e){}
})();
</script>
</body>
</html>
